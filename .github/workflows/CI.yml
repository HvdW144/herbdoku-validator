name: CI

on:
  push:
    branches:
      - main
      - release/**/*
  pull_request:
    branches:
      - main
      - release/**/*

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: "npm"
      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint app
        run: npm run lint

      - name: Test app
        run: npm run test
